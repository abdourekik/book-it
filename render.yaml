# Render blueprint: the Book-it API.
#
# Render reads this file and creates the web service described below. The reminder cron
# job is defined at the bottom but commented out for the first deploy - see the note
# there.
#
# The database is NOT defined here. It lives on Supabase, so it survives independently of
# any deploy and can be backed up and restored without touching this repo.
#
# Nothing secret is in this file. Secrets are either marked `sync: false`, which makes
# Render prompt for them in the dashboard, or `generateValue: true`, which makes Render
# invent one. Neither ends up in git.

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: book-it-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend

    buildCommand: pip install -r requirements.txt

    # Migrations run here, not in the build. A build runs before the new version is
    # live and may run more than once; a preDeploy runs exactly once, immediately
    # before traffic switches over, which is what schema changes need.
    preDeployCommand: alembic upgrade head

    # One worker on the free plan. --workers would fork more, each with its own
    # connection pool, which the free Postgres connection limit will not tolerate.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"

      # Prompted for in the Render dashboard, never stored in git.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        # Render generates a strong random value on first deploy.
        generateValue: true
      # The public URL of the Vercel frontend. Used to build the links inside emails,
      # so a wrong value here sends customers to a dead page. Set a placeholder on the
      # first deploy and correct it once Vercel has given you a URL.
      - key: APP_BASE_URL
        sync: false

      # RESEND_API_KEY and EMAIL_FROM are deliberately NOT declared here.
      #
      # Both have working defaults in app/config.py: with no API key the app logs emails
      # instead of sending them, which is exactly what you want before email is set up.
      # Add them in the Render dashboard (Environment tab) when you configure Resend -
      # a blueprint that demands values you do not have yet just blocks the first deploy.

  # ------------------------------------------------------- reminder job
  #
  # COMMENTED OUT FOR THE FIRST DEPLOY, for two reasons:
  #   1. Render cron jobs are not included in the free tier.
  #   2. Without RESEND_API_KEY the job logs instead of sending, so it would do nothing.
  #
  # Uncomment the whole block once you have set up Resend and are ready to pay for a
  # cron instance, or run the same command from any external scheduler:
  #     python -m scripts.send_reminders
  #
  # # ------------------------------------------------------- reminder job
  # - type: cron
  #   name: book-it-reminders
  #   runtime: python
  #   region: frankfurt
  #   plan: free
  #   rootDir: backend

  #   # Hourly. The job selects appointments 23-25 hours out and stamps each row as it
  #   # sends, so running every hour emails each customer exactly once - and a missed run
  #   # is caught by the next one rather than silently skipping a day.
  #   schedule: "0 * * * *"

  #   buildCommand: pip install -r requirements.txt
  #   startCommand: python -m scripts.send_reminders

